<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Users</title>
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        /* Reset & Layout */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #f7f9fc; color: #333; }

        /* Sidebar */
        .sidebar { width: 220px; background-color: #ff6a19; color: white; padding: 20px 0; flex-shrink: 0; }
        .sidebar h2 { padding: 0 20px; font-size: 1.25rem; margin-bottom: 25px; font-weight: 700; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 12px 20px; cursor: pointer; color: rgba(255, 255, 255, 0.9); font-size: 0.9rem; margin: 4px 12px; border-radius: 6px; }
        .sidebar ul li:hover { background-color: rgba(255, 255, 255, 0.15); }
        .sidebar ul li.active { background-color: rgba(255, 255, 255, 0.25); color: white; font-weight: 600; }
        .sidebar ul li a { color: inherit; text-decoration: none; display: block; }

        /* Main Content Area */
        .main-content { flex-grow: 1; padding: 25px 35px; overflow-y: auto; }

        /* Header */
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .main-header h1 { font-size: 1.5rem; color: #333; font-weight: 700; }
        .live-status { color: #28a745; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; }
        .live-status::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: #28a745; border-radius: 50%; }

        /* Stat Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px 24px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .stat-card h3 { color: #555; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .stat-card p { font-size: 1.8rem; font-weight: 700; color: #ff6a19; }

        /* Sections */
        .section-container { margin-bottom: 25px; }
        .section-header { margin-bottom: 15px; }
        .section-header h2 { font-size: 1.25rem; color: #333; font-weight: 700; }

        /* Add User Form */
        .add-user-card { background: white; padding: 20px 24px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .add-user-form { display: grid; grid-template-columns: 1fr 1.2fr 1fr 1fr auto; gap: 15px; align-items: center; }
        .add-user-form input, .add-user-form select { 
            padding: 10px 14px; 
            border: 1px solid #e1e5eb; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            outline: none;
            width: 100%;
            background-color: #fff;
        }
        .add-user-form input.filled-field { background-color: #eef4ff; border-color: #d0e1fd; }
        .add-user-form input:focus, .add-user-form select:focus { border-color: #ff6a19; }
        .add-user-btn { 
            background-color: #ff6a19; 
            color: white; 
            padding: 10px 24px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem; 
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .add-user-btn:hover { background-color: #e65c15; }

        /* Users Table */
        .table-wrapper { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead { background-color: #ff6a19; color: white; }
        th, td { text-align: left; padding: 14px 20px; border-bottom: 1px solid #f0f0f0; }
        th { font-weight: 600; font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        
        .user-name { font-weight: 700; color: #222; }
        .user-email { color: #555; }

        /* Role Badges */
        .role-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; display: inline-block; letter-spacing: 0.5px; }
        .role-badge.admin { background-color: #fff0e6; color: #ff6a19; border: 1px solid #ffd8cc; }
        .role-badge.user { background-color: #eafaf1; color: #2ecc71; border: 1px solid #d4f5e2; }

        /* Action Buttons */
        .action-btns { display: flex; gap: 8px; }
        .action-btn { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: white; transition: opacity 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .btn-edit { background-color: #2ecc71; }
        .btn-delete { background-color: #e74c3c; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admindashbord.html">Dashboard</a></li>
            <li class="active"><a href="users.html">Users</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="admindashbordcatering.html">Catering</a></li>
            <li><a href="login.html" onclick="logoutUser(); return false;">Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1>Users</h1>
            <div class="live-status">Live — synced across all pages</div>
        </header>

        <!-- Stats Section -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsersCount">—</p>
            </div>
            <div class="stat-card">
                <h3>Admins</h3>
                <p id="adminsCount">—</p>
            </div>
            <div class="stat-card">
                <h3>Users</h3>
                <p id="usersCount">—</p>
            </div>
        </section>

        <!-- Add New User Form Section -->
        <section class="section-container">
            <div class="section-header">
                <h2>Add New User</h2>
            </div>
            <div class="add-user-card">
                <form class="add-user-form" id="addUserForm">
                    <input type="text" placeholder="Full Name" id="userNameInput" required>
                    <input type="email" placeholder="Email" id="userEmailInput" required>
                    <input type="password" placeholder="Password" id="userPasswordInput" required minlength="6">
                    <select id="userRoleSelect">
                        <option value="USER" selected>User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                    <button type="submit" class="add-user-btn">Add User</button>
                </form>
            </div>
        </section>

        <!-- Users Table Section -->
        <section class="section-container">
            <div class="section-header">
                <h2>All Users</h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- User rows will be injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
        const session = requireAdmin();

        // Users keyed by _id, so a live socket event can patch one row
        // instead of re-fetching and re-rendering everything.
        let usersById = {};

        const usersTableBody = document.getElementById("usersTableBody");
        const totalUsersCountEl = document.getElementById("totalUsersCount");
        const adminsCountEl = document.getElementById("adminsCount");
        const usersCountEl = document.getElementById("usersCount");
        const addUserForm = document.getElementById("addUserForm");

        function updateCounts(users) {
            const total = users.length;
            const admins = users.filter(u => u.isAdmin).length;
            const regular = total - admins;

            totalUsersCountEl.textContent = total;
            adminsCountEl.textContent = admins;
            usersCountEl.textContent = regular;
        }

        function renderRow(user) {
            const role = user.isAdmin ? "ADMIN" : "USER";
            const isSelf = session && (user._id === session.id || user._id === session._id);

            return `
                <tr id="user-row-${user._id}">
                    <td class="user-name">${user.name}${isSelf ? " (you)" : ""}</td>
                    <td class="user-email">${user.email}</td>
                    <td>
                        <span class="role-badge ${role.toLowerCase()}">${role}</span>
                    </td>
                    <td>
                        <div class="action-btns">
                            ${user.isAdmin
                                ? ""
                                : `<button class="action-btn btn-edit" onclick="promoteUserRow('${user._id}')">Promote</button>`
                            }
                            <button class="action-btn btn-delete" ${isSelf ? "disabled title=\"You can't delete your own account\"" : ""} onclick="deleteUserRow('${user._id}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderUsersTable() {
            const users = Object.values(usersById)
                .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

            usersTableBody.innerHTML = users.length
                ? users.map(renderRow).join("")
                : `<tr><td colspan="4" style="text-align:center;color:#888;padding:20px;">No users yet</td></tr>`;

            updateCounts(users);
        }

        async function loadUsers() {
            const users = await getUsers(); // GET /api/users/all
            usersById = {};
            users.forEach(u => { usersById[u._id] = u; });
            renderUsersTable();
        }

        // Add User Handler — creates a real account via the public
        // register endpoint, then promotes it to admin if that role
        // was selected (there's no "create as admin" endpoint).
        addUserForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("userNameInput").value.trim();
            const email = document.getElementById("userEmailInput").value.trim();
            const password = document.getElementById("userPasswordInput").value;
            const role = document.getElementById("userRoleSelect").value;

            if (!name || !email || !password) return;

            const result = await registerUser({ name, email, password });
            if (!result.ok) {
                alert(result.message || "Could not create user");
                return;
            }

            const newUserId = result.user?.user?.id;

            if (role === "ADMIN" && newUserId) {
                try {
                    await promoteUser(newUserId);
                } catch (err) {
                    alert("User created, but promoting to admin failed: " + err.message);
                }
            }

            addUserForm.reset();
            await loadUsers();
        });

        async function promoteUserRow(id) {
            try {
                await promoteUser(id);
                if (usersById[id]) usersById[id].isAdmin = true;
                renderUsersTable();
            } catch (err) {
                alert(err.message || "Could not promote user");
            }
        }

        async function deleteUserRow(id) {
            if (!confirm("Delete this user? This can't be undone.")) return;
            try {
                await deleteUser(id);
                delete usersById[id];
                renderUsersTable();
            } catch (err) {
                alert(err.message || "Could not delete user");
            }
        }

        // Real-time: new signups, promotions, and deletions from any
        // admin tab (or a customer registering) land here instantly.
        function setupLiveUsers() {
            const socket = connectSocket();
            if (!socket) return;

            socket.on("user:new", (user) => {
                usersById[user._id] = user;
                renderUsersTable();
            });

            socket.on("user:updated", (user) => {
                usersById[user._id] = user;
                renderUsersTable();
            });

            socket.on("user:deleted", ({ _id }) => {
                delete usersById[_id];
                renderUsersTable();
            });
        }

        loadUsers();
        setupLiveUsers();
    </script>
</body>
</html>
