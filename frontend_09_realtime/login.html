<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub Login</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="stylesheet" href="assets/responsive.css">

    <style>
* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff5722, #ff9800);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #ff5722;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background: #e64a19;
        }

        .small-btns {
            display: flex;
            gap: 10px;
        }

        .small-btns button {
            flex: 1;
        }

        p {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #ff5722;
            text-decoration: none;
            font-weight: bold;
        }
</style>
</head>

<body>

    <div class="login-box">

        <h2>🍔 FoodieHub Login</h2>

        <input type="email" id="email" placeholder="Enter Email">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Login</button>



        <p>New user? <a href="register.html">Register</a></p>

    </div>

    <script src="assets/app.js"></script>
    <script>

        const session = getSession();
        if (session) {
            if (session.isAdmin) {
                window.location.href = "admindashbord.html";
            } else {
                window.location.href = "menu.html";
            }
        }

        // LOGIN FUNCTION — calls the real backend /auth/login endpoint
        // and stores the JWT + user so other pages can use them.
        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Please enter email and password");
                return;
            }

            try {

                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.message || "Login failed");
                    return;
                }

                // Save token + user for later authenticated requests
                if (data.token) {
                    localStorage.setItem("fh_token", data.token);
                }
                if (data.user) {
                    localStorage.setItem("fh_user", JSON.stringify(data.user));
                }
                const isAdmin = Boolean(data.user && (data.user.isAdmin || data.user.role === "admin"));
                if (isAdmin) {
                    window.location.href = "admindashbord.html";
                } else {
                    window.location.href = "menu.html";
                }

            } catch (err) {

                alert(`Could not reach server at ${API_BASE}. Is the backend running?`);

            }
        }

    </script>

</body>

</html>
