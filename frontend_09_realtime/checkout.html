<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub Checkout</title>
    <link rel="stylesheet" href="assets/responsive.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        nav {
            background: linear-gradient(to right, #ff4b2b, #f39c12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 0 10px;
        }

        .menu a:hover {
            color: #fff3cd;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 24px;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .form-block {
            display: grid;
            gap: 10px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-top: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 14px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .summary {
            background: #fff8f4;
            border: 1px solid #ffd2b8;
            border-radius: 12px;
            padding: 20px;
        }

        .summary h3 {
            margin-bottom: 15px;
            color: #ff5722;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0d3c0;
        }

        .summary-total {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 2px solid #ff5722;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            margin-top: 15px;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #ff5722;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #e64a19;
        }

        .scanner-box {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #f2d0c1;
            border-radius: 12px;
            background: #fffaf7;
        }

        .scanner-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .scanner-actions button {
            margin-top: 0;
            flex: 1 1 180px;
        }

        .scanner-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .scanner-modal.show {
            display: flex;
        }

        .scanner-panel {
            width: min(760px, 100%);
            background: #f5f5f5;
            border-radius: 0;
            padding: 30px 24px 18px;
            box-shadow: none;
            text-align: center;
        }

        .phonepe-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        .phonepe-logo {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #5f2ea8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
        }

        .phonepe-brand {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -2px;
            color: #4b1f7a;
        }

        .scanner-panel h3 {
            font-size: 38px;
            letter-spacing: -1px;
            color: #4b1f7a;
            font-weight: 800;
            margin: 22px 0 18px;
            text-transform: uppercase;
        }

        .scanner-subtitle {
            font-size: 34px;
            color: #1f1f1f;
            margin-bottom: 26px;
            font-weight: 500;
            letter-spacing: -1px;
        }

        .scanner-amount {
            display: inline-block;
            margin: 0 auto 24px;
            padding: 10px 20px;
            border-radius: 8px;
            background: #f1e8ff;
            color: #4b1f7a;
            font-size: 28px;
            font-weight: 800;
        }

        #qr-reader {
            width: min(540px, 100%);
            height: 540px;
            background: white;
            border: 6px solid #171717;
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto 18px;
            position: relative;
        }

        #qr-reader video,
        #qr-reader canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            display: block;
            background: white;
        }

        #phonepeScannerImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: white;
        }

        .phonepe-center-mark {
            position: absolute;
            width: 88px;
            height: 88px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #1d1d1d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            z-index: 2;
            pointer-events: none;
        }

        .scanner-name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #2d2d2d;
            margin: 18px 0 10px;
            text-transform: uppercase;
        }

        .scanner-footer {
            margin-top: 26px;
            font-size: 19px;
            color: #4a4a4a;
            line-height: 1.5;
            font-weight: 500;
        }

        .scanner-close {
            background: #3a3a3a;
            margin-top: 18px;
            width: min(220px, 100%);
            border-radius: 12px;
            font-size: 16px;
        }

        @media (max-width: 800px) {
            .checkout-layout,
            .two-col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">🍔 FoodieHub</div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="menu.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Menu</a>
            <a href="cart.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Cart</a>
            <a href="history.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">History</a>
            <a href="profile.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Profile</a>
            <a href="logout.html">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="checkout-layout">
            <div>
                <h2>Checkout</h2>

                <form id="checkoutForm" class="form-block">
                    <div class="two-col">
                        <div>
                            <label for="name">Full Name</label>
                            <input id="name" name="name" type="text" required>
                        </div>
                        <div>
                            <label for="phone">Phone Number</label>
                            <input id="phone" name="phone" type="tel" required>
                        </div>
                    </div>

                    <div>
                        <label for="email">Email ID</label>
                        <input id="email" name="email" type="email" required>
                    </div>

                    <div>
                        <label for="address">Address</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>

                    <div class="two-col">
                        <div>
                            <label for="city">City</label>
                            <input id="city" name="city" type="text" required>
                        </div>
                        <div>
                            <label for="pincode">Pincode</label>
                            <input id="pincode" name="pincode" type="text" required>
                        </div>
                    </div>

                    <div>
                        <label for="paymentMethod">Payment Method</label>
                        <select id="paymentMethod" name="paymentMethod">
                            <option value="COD">Cash on Delivery</option>
                            <option value="UPI">UPI / QR Payment</option>
                            <option value="CARD">Credit or Debit Card</option>
                            <option value="NETBANKING">Net Banking</option>
                            <option value="WALLET">Digital Wallet</option>
                        </select>
                    </div>

                    <div class="scanner-box">
                        <label>Payment QR Scanner</label>
                        <div class="scanner-actions">
                            <button type="button" id="scanPaymentBtn">Show PhonePe QR</button>
                        </div>
                        <input id="paymentReference" name="paymentReference" type="text" placeholder="Enter payment reference after payment" style="margin-top:10px;">
                    </div>

                    <button type="submit">Place Order</button>
                </form>
            </div>

            <aside class="summary">
                <h3>Order Summary</h3>
                <div id="cartSummaryItems"></div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="checkoutTotal">₹0</span>
                </div>
            </aside>
        </div>
    </div>

    <div id="scannerModal" class="scanner-modal" aria-hidden="true">
        <div class="scanner-panel">
            <div class="phonepe-header">
                <div class="phonepe-logo">प</div>
                <div class="phonepe-brand">PhonePe</div>
            </div>

            <h3>Accepted Here</h3>
            <div class="scanner-subtitle">Scan &amp; Pay Using PhonePe App</div>
            <div class="scanner-amount">Pay exactly <span id="scannerAmount">₹0</span></div>

            <div id="qr-reader">
                <div id="paymentQrCode" aria-label="Dynamic UPI payment QR code"></div>
            </div>

            <div class="scanner-name">GOKARNA DATTATRAY MORE</div>

            <div class="scanner-footer">
                © 2026, All rights reserved, PhonePe Ltd<br>
                (Formerly known as 'PhonePe Private Ltd')
            </div>

            <button type="button" class="scanner-close" id="closeScannerBtn">Close Scanner</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
        const session = requireLogin();

        if (!session) {
            window.location.href = "login.html";
        }

        async function loadUserDefaults() {
            try {
                const profile = await getProfile();
                const savedSession = getSession();
                const fallbackPhone = savedSession?.contact || savedSession?.phone || profile?.contact || "";

                document.getElementById("name").value = profile.name || savedSession?.name || "";
                document.getElementById("phone").value = profile.contact || fallbackPhone || "";
                document.getElementById("email").value = profile.email || savedSession?.email || "";
                document.getElementById("address").value = profile.address || "";

                if (savedSession) {
                    document.getElementById("name").value = document.getElementById("name").value || savedSession.name || "";
                    document.getElementById("phone").value = document.getElementById("phone").value || fallbackPhone || "";
                    document.getElementById("email").value = document.getElementById("email").value || savedSession.email || "";
                }
            } catch (err) {
                console.error("Profile load failed:", err);
                const savedSession = getSession();
                if (savedSession) {
                    document.getElementById("name").value = savedSession.name || "";
                    document.getElementById("phone").value = savedSession.contact || savedSession.phone || "";
                    document.getElementById("email").value = savedSession.email || "";
                }
            }
        }

        async function renderCartSummary() {
            const cart = await getCart();
            const itemsContainer = document.getElementById("cartSummaryItems");
            itemsContainer.innerHTML = "";

            if (!cart || cart.length === 0) {
                itemsContainer.innerHTML = "<p>Cart is empty.</p>";
                document.getElementById("checkoutTotal").innerText = "₹0";
                return;
            }

            cart.forEach(item => {
                const name = item.name || item.product?.name || "Item";
                const price = item.price || 0;
                const qty = item.quantity || 1;
                const total = price * qty;

                itemsContainer.insertAdjacentHTML("beforeend", `
                    <div class="summary-item">
                        <span>${name} x ${qty}</span>
                        <span>₹${total}</span>
                    </div>
                `);
            });

            const total = cartTotal(cart);
            document.getElementById("checkoutTotal").innerText = `₹${total}`;
            document.getElementById("scannerAmount").innerText = `₹${total}`;
            renderPaymentQr(total);
        }

        function startPaymentScanner() {
            const modal = document.getElementById("scannerModal");
            const total = Number(document.getElementById("checkoutTotal").innerText.replace(/[^0-9.]/g, "")) || 0;
            document.getElementById("paymentMethod").value = "UPI";
            renderPaymentQr(total);
            modal.classList.add("show");
        }

        function renderPaymentQr(amount) {
            const qrContainer = document.getElementById("paymentQrCode");
            qrContainer.innerHTML = "";
            document.getElementById("scannerAmount").innerText = `₹${amount.toFixed(2)}`;

            if (typeof QRCode === "undefined") {
                qrContainer.innerText = "QR generator unavailable. Please reload the page.";
                return;
            }

            const upiUrl = new URL("upi://pay");
            upiUrl.searchParams.set("pa", "9607697788@ybl");
            upiUrl.searchParams.set("pn", "FoodieHub");
            upiUrl.searchParams.set("am", amount.toFixed(2));
            upiUrl.searchParams.set("cu", "INR");
            upiUrl.searchParams.set("tn", "FoodieHub order payment");

            new QRCode(qrContainer, {
                text: upiUrl.toString(),
                width: 500,
                height: 500,
                colorDark: "#171717",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        document.getElementById("scanPaymentBtn").addEventListener("click", startPaymentScanner);
        document.getElementById("closeScannerBtn").addEventListener("click", () => {
            const modal = document.getElementById("scannerModal");
            modal.classList.remove("show");
        });

        document.getElementById("checkoutForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const session = getSession();
            if (!session) {
                alert("Please login first to order items.");
                window.location.href = "login.html";
                return;
            }

            const cart = await getCart();
            if (!cart || cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            const customerData = {
                name: document.getElementById("name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                email: document.getElementById("email").value.trim(),
                address: document.getElementById("address").value.trim(),
                city: document.getElementById("city").value.trim(),
                pincode: document.getElementById("pincode").value.trim(),
                paymentMethod: document.getElementById("paymentMethod").value,
                paymentReference: document.getElementById("paymentReference").value.trim()
            };

            if (!customerData.name || !customerData.phone || !customerData.email || !customerData.address || !customerData.city || !customerData.pincode) {
                alert("Please fill in all delivery details.");
                return;
            }

            if (customerData.paymentMethod === "UPI" && !customerData.paymentReference) {
                alert("Please scan the payment QR code before placing an online payment order.");
                return;
            }

            try {
                const result = await placeOrder(customerData);
                alert(result.message || "Order placed successfully!");
                window.location.href = "history.html";
            } catch (err) {
                alert(err.message || "Unable to place order.");
            }
        });

        loadUserDefaults();
        renderCartSummary();
    </script>
</body>

</html>
