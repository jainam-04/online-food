<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub Cart</title>
    <link rel="stylesheet" href="assets/responsive.css">

    <style>
* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(to right, #ff4b2b, #f39c12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 0 10px;
        }

        .menu a:hover {
            color: #fff3cd;
        }

        /* CART */
        .container {
            max-width: 800px;
            margin: 28px auto;
            background: white;
            padding: 24px 22px 18px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .container h2 {
            font-size: 28px;
            margin: 0 0 12px;
            color: #333;
            line-height: 1.2;
        }

        .container h3 {
            font-size: 22px;
            color: #333;
            margin-top: 16px;
            line-height: 1.3;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ddd;
            gap: 10px;
        }

        .item .name {
            flex: 1;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-controls button {
            width: auto;
            min-width: 32px;
            height: auto;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1;
            font-weight: bold;
            background: #ff5722;
            color: white;
        }

        .remove-btn {
            background: #ff5722 !important;
            padding: 8px 14px !important;
            font-size: 14px !important;
            border-radius: 20px !important;
            font-weight: bold !important;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: #ff5722;
            transition: all 0.2s ease;
        }

        button:hover {
            background: black;
        }

        .checkout {
            background: #ff5722;
            min-width: 130px;
        }

        .live-note {
            font-size: 13px;
            color: #2ecc71;
            font-weight: bold;
            margin: 0 0 14px;
            line-height: 1.4;
        }
</style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">🍔 FoodieHub</div>

        <div class="menu">
            <a href="index.html">Home</a>
            <a href="menu.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Menu</a>
            <a href="suggest item.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Suggest Item</a>
            <a href="cart.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Cart</a>
            <a href="checkout.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Checkout</a>
            <a href="history.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">History</a>
            <a href="about.html">About</a>
            <a href="profile.html" onclick="if (!localStorage.getItem('fh_token')) { alert('Please login first to order items.'); window.location.href='login.html'; return false; }">Profile</a>
            <a href="logout.html" onclick="logoutUser(); return false;">Logout</a>
        </div>
    </nav>

    <!-- CART -->
    <div class="container">

        <h2>🛒 Your Cart</h2>
        <p class="live-note">● Live — updates instantly, even across other open tabs</p>

        <div id="cartItems"></div>

        <h3>Total: ₹<span id="total">0</span></h3>

        <div class="actions">
            <button class="checkout" onclick="goCheckout()">Checkout</button>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="assets/app.js"></script>
    <script>

        // This page is for logged-in customers only.
        requireLogin();

        async function loadAndRenderCart() {
            const cart = await getCart();
            renderCart(cart);
        }

        function renderCart(cart) {
            const box = document.getElementById("cartItems");
            box.innerHTML = "";

            if (cart.length === 0) {
                box.innerHTML = "<p>Cart is empty 🛒</p>";
                document.getElementById("total").innerText = 0;
                return;
            }

            cart.forEach(item => {
                // product may be populated object or just an id
                const foodId = item.product?._id || item.product;
                const foodName = item.name || item.product?.name || "Item";
                box.innerHTML += `
                <div class="item">
                    <span class="name">${foodName} — ₹${item.price}</span>
                    <div class="qty-controls">
                        <button onclick="handleUpdateQty('${foodId}', ${item.quantity - 1})">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="handleUpdateQty('${foodId}', ${item.quantity + 1})">+</button>
                    </div>
                    <span>₹${item.total || item.price * item.quantity}</span>
                    <button class="remove-btn" onclick="handleRemove('${foodId}')">Remove</button>
                </div>`;
            });

            document.getElementById("total").innerText = cartTotal(cart);
        }

        async function handleUpdateQty(id, qty) {
            await updateCartQty(id, qty);
            await loadAndRenderCart();
            await fhMountCartBadge();
        }

        async function handleRemove(id) {
            await removeFromCart(id);
            await loadAndRenderCart();
            await fhMountCartBadge();
        }

        async function goCheckout() {
            const session = getSession();
            if (!session) {
                alert("Please login first to order items.");
                window.location.href = "login.html";
                return;
            }

            const cart = await getCart();
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }
            window.location.href = "checkout.html";
        }

        function setupLiveCart() {
            const socket = connectSocket();
            if (!socket) return;

            socket.on("cart:updated", (cart) => {
                renderCart(cart?.items || []);
                fhMountCartBadge();
            });
        }

        window.onload = () => {
            loadAndRenderCart();
            setupLiveCart();
        };

    </script>

</body>

</html>
