<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Products</title>
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        /* Base Reset & Layout */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #f7f9fc; color: #333; }

        /* Sidebar */
        .sidebar { width: 220px; background-color: #ff6a19; color: white; padding: 20px 0; flex-shrink: 0; }
        .sidebar h2 { padding: 0 20px; font-size: 1.25rem; margin-bottom: 25px; font-weight: 700; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 0; margin: 4px 12px; border-radius: 6px; }
        .sidebar ul li a { display: block; padding: 12px 20px; color: rgba(255, 255, 255, 0.9); text-decoration: none; font-size: 0.9rem; border-left: 3px solid transparent; }
        .sidebar ul li:hover { background-color: rgba(255, 255, 255, 0.15); }
        .sidebar ul li a:hover { color: white; }
        .sidebar ul li.active { background-color: rgba(255, 255, 255, 0.25); }
        .sidebar ul li.active a { color: white; font-weight: 600; border-left-color: white; }

        /* Main Content */
        .main-content { flex-grow: 1; padding: 25px 35px; overflow-y: auto; }

        /* Header */
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .main-header h1 { font-size: 1.5rem; color: #333; font-weight: 700; }
        .live-status { color: #28a745; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; }
        .live-status::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: #28a745; border-radius: 50%; }

        /* Stat Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px 24px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); grid-column: span 3; max-width: 400px; }
        .stat-card h3 { color: #555; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .stat-card p { font-size: 1.8rem; font-weight: 700; color: #ff6a19; }

        /* Section Containers */
        .section-container { margin-bottom: 25px; }
        .section-header { margin-bottom: 15px; }
        .section-header h2 { font-size: 1.25rem; color: #333; font-weight: 700; }

        /* Add Product Form */
        .add-product-card { background: white; padding: 20px 24px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .form-row-1 { display: grid; grid-template-columns: 1fr 1fr 1fr 1.2fr; gap: 15px; margin-bottom: 15px; align-items: center; }
        .form-row-2 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; align-items: start; }
        
        .add-product-form input[type="text"], 
        .add-product-form input[type="number"], 
        .add-product-form textarea { 
            padding: 10px 14px; 
            border: 1px solid #e1e5eb; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            outline: none;
            width: 100%;
            background-color: #fff;
        }
        .add-product-form textarea { resize: none; height: 50px; }
        .add-product-form input:focus, .add-product-form textarea:focus { border-color: #ff6a19; }

        /* File Upload Styling */
        .file-upload-box { display: flex; border: 1px solid #e1e5eb; border-radius: 6px; overflow: hidden; background: #fff; height: 38px; }
        .file-upload-btn { background: #eef2f5; border: none; padding: 0 12px; font-size: 0.8rem; cursor: pointer; border-right: 1px solid #e1e5eb; color: #444; white-space: nowrap; }
        .file-upload-label { padding: 9px 12px; font-size: 0.8rem; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; }
        .file-upload-input { display: none; }

        /* Image Preview Box */
        .image-preview-box { height: 50px; background: #fafbfc; border: 1px dashed #dcdfe6; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #a8abb2; padding: 0 10px; text-align: center; }
        
        .add-product-btn { 
            background-color: #ff6a19; 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem; 
            white-space: nowrap;
            height: 50px;
            transition: background-color 0.2s;
        }
        .add-product-btn:hover { background-color: #e65c15; }

        /* Products Table */
        .table-wrapper { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead { background-color: #ff6a19; color: white; }
        th, td { text-align: left; padding: 14px 20px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        th { font-weight: 600; font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        
        .product-img { width: 45px; height: 35px; border-radius: 4px; object-fit: cover; display: block; background-color: #eee; }
        .product-name { font-weight: 600; color: #222; }
        .product-category { color: #555; }
        .product-price { font-weight: 600; color: #222; }
        .product-details { color: #666; font-size: 0.8rem; }

        /* Action Buttons */
        .action-btns { display: flex; gap: 8px; }
        .action-btn { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: white; transition: opacity 0.2s; }
        .action-btn:hover { opacity: 0.9; }
        .btn-edit { background-color: #2ecc71; }
        .btn-delete { background-color: #e74c3c; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admindashbord.html">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li class="active"><a href="products.html">Products</a></li>
            <li><a href="admindashbordcatering.html">Catering</a></li>
            <li><a href="login.html" onclick="logoutUser(); return false;">Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1>Products</h1>
            <div class="live-status">Live — synced across all pages</div>
        </header>

        <!-- Stats Section -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Products</h3>
                <p id="totalProductsCount">8</p>
            </div>
        </section>

        <!-- Add New Product Section -->
        <section class="section-container">
            <div class="section-header">
                <h2>Add New Product</h2>
            </div>
            <div class="add-product-card">
                <form class="add-product-form" id="addProductForm">
                    <div class="form-row-1">
                        <input type="text" placeholder="Food Name" id="productName" required>
                        <input type="text" placeholder="Category" id="productCategory" required>
                        <input type="number" placeholder="Price" id="productPrice" required>
                        <div class="file-upload-box">
                            <button type="button" class="file-upload-btn" onclick="document.getElementById('productImage').click()">Choose File</button>
                            <span class="file-upload-label" id="fileNameLabel">No file chosen</span>
                            <input type="file" id="productImage" class="file-upload-input" accept="image/*" onchange="handleFileSelect(event)">
                        </div>
                    </div>
                    <div class="form-row-2">
                        <textarea placeholder="Details / description (ingredients, spice level, etc.)" id="productDetails"></textarea>
                        <div class="image-preview-box" id="imagePreview">Image preview will appear here</div>
                        <button type="submit" class="add-product-btn">Add Product</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- All Products Table Section -->
        <section class="section-container">
            <div class="section-header">
                <h2>All Products</h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Details</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Dynamic content injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
        const defaultImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='35' viewBox='0 0 45 35'><rect width='45' height='35' fill='%23e28743'/><circle cx='22' cy='17' r='10' fill='%23fce0a6'/><path d='M15 15 Q22 5 29 15 Z' fill='%23d9431e'/></svg>";
        const productsTableBody = document.getElementById("productsTableBody");
        const totalProductsCountEl = document.getElementById("totalProductsCount");
        const addProductForm = document.getElementById("addProductForm");
        const fileNameLabel = document.getElementById("fileNameLabel");
        const imagePreview = document.getElementById("imagePreview");
        let selectedImageSrc = defaultImg;
        let productsById = {};

        function updateProductCount() {
            totalProductsCountEl.textContent = Object.keys(productsById).length;
        }

        function renderProductsTable() {
            const products = Object.values(productsById).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            productsTableBody.innerHTML = products.map(item => `
                <tr>
                    <td><img src="${item.image || defaultImg}" alt="${item.name}" class="product-img"></td>
                    <td class="product-name">${item.name}</td>
                    <td class="product-category">${item.category}</td>
                    <td class="product-price">₹${item.price}</td>
                    <td class="product-details">${item.details || item.description || "No details"}</td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn btn-edit" onclick="editProduct('${item._id}')">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteProduct('${item._id}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join("");

            updateProductCount();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                fileNameLabel.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageSrc = e.target.result;
                    imagePreview.innerHTML = `<img src="${selectedImageSrc}" style="height: 100%; max-width: 100%; object-fit: contain;">`;
                };
                reader.readAsDataURL(file);
            } else {
                fileNameLabel.textContent = "No file chosen";
                imagePreview.textContent = "Image preview will appear here";
                selectedImageSrc = defaultImg;
            }
        }

        async function loadProducts() {
            try {
                const products = await getProducts();
                productsById = {};
                products.forEach(item => { productsById[item._id] = item; });
                renderProductsTable();
            } catch (err) {
                console.error('Failed to load products', err);
            }
        }

        async function deleteProduct(id) {
            try {
                await deleteProductApi(id);
                delete productsById[id];
                renderProductsTable();
            } catch (err) {
                alert(err.message || 'Could not delete product');
            }
        }

        async function deleteProductApi(id) {
            return await apiFetch(`/api/menu/delete/${id}`, 'DELETE', null, false);
        }

        function editProduct(id) {
            alert(`Edit product ID: ${id}`);
        }

        addProductForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("productName").value.trim();
            const category = document.getElementById("productCategory").value.trim();
            const price = Number(document.getElementById("productPrice").value);
            const details = document.getElementById("productDetails").value.trim() || "N/A";

            if (!name || !category || !price) {
                alert('Please fill all product fields.');
                return;
            }

            try {
                await addProduct({
                    name,
                    category,
                    price,
                    details,
                    description: details,
                    image: selectedImageSrc !== defaultImg ? selectedImageSrc : ''
                });
                addProductForm.reset();
                fileNameLabel.textContent = 'No file chosen';
                imagePreview.textContent = 'Image preview will appear here';
                selectedImageSrc = defaultImg;
                await loadProducts();
            } catch (err) {
                alert(err.message || 'Could not add product');
            }
        });

        function setupLiveProducts() {
            const socket = connectSocket();
            if (!socket) return;

            socket.on('menu:new', (food) => {
                productsById[food._id] = food;
                renderProductsTable();
            });

            socket.on('menu:updated', (food) => {
                productsById[food._id] = food;
                renderProductsTable();
            });

            socket.on('menu:deleted', ({ _id }) => {
                delete productsById[_id];
                renderProductsTable();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            setupLiveProducts();
        });
    </script>
</body>
</html>
