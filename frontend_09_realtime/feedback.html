<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback - FoodieHub</title>
  <link rel="stylesheet" href="assets/responsive.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #ff512f, #f09819);
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .page {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px 40px;
    }

    .card {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.15);
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      color: #ff512f;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #555;
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: linear-gradient(45deg, #ff512f, #f09819);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .reviews {
      margin-top: 28px;
    }

    .review-box {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-left: 5px solid #ff512f;
      border-radius: 12px;
      padding: 16px 18px;
      margin-top: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .review-name {
      font-weight: 700;
      color: #333;
    }

    .stars {
      color: #ffb000;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .empty {
      padding: 24px;
      text-align: center;
      color: #666;
      background: #fff;
      border-radius: 10px;
      border: 1px dashed #ddd;
    }
  </style>
</head>
<body>
  <header>
    <h2>🍔 FoodieHub</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="suggest item.html">Suggest Item</a>
      <a href="feedback.html">Feedback</a>
      <a href="profile.html">Profile</a>
      <a href="logout.html">Logout</a>
    </nav>
  </header>

  <div class="page">
    <div class="card">
      <h1>Customer Feedback</h1>
      <p class="subtitle">Share your experience and help us improve the FoodieHub service.</p>

      <form id="feedbackForm">
        <div class="form-grid">
          <div>
            <label for="title">Title</label>
            <input id="title" name="title" type="text" placeholder="Amazing food and quick service" required />
          </div>

          <div>
            <label for="rating">Rating</label>
            <select id="rating" name="rating" required>
              <option value="">Select rating</option>
              <option value="5">5 - Excellent</option>
              <option value="4">4 - Very Good</option>
              <option value="3">3 - Good</option>
              <option value="2">2 - Fair</option>
              <option value="1">1 - Poor</option>
            </select>
          </div>

          <div>
            <label for="comment">Your Feedback</label>
            <textarea id="comment" name="comment" placeholder="Tell us about your experience..." required></textarea>
          </div>

          <button type="submit">Submit Feedback</button>
        </div>
      </form>

      <div class="reviews">
        <h2>Recent Feedback</h2>
        <div id="reviewsList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const reviewsList = document.getElementById('reviewsList');
    const feedbackForm = document.getElementById('feedbackForm');

    function starText(value) {
      return '★'.repeat(Number(value || 0)) + '☆'.repeat(5 - Number(value || 0));
    }

    function renderReviews(items) {
      if (!items || !items.length) {
        reviewsList.innerHTML = '<div class="empty">No feedback submitted yet. Be the first to share your experience.</div>';
        return;
      }

      reviewsList.innerHTML = items.map(item => {
        const userName = item.user?.name || 'Customer';
        const rating = Number(item.rating || 0);
        return `
          <div class="review-box">
            <div class="review-header">
              <div class="review-name">${item.title || 'Feedback'}</div>
              <div class="stars">${starText(rating)}</div>
            </div>
            <div style="color:#666; margin-bottom:8px;">By ${userName}</div>
            <div>${item.comment || ''}</div>
          </div>
        `;
      }).join('');
    }

    async function loadReviews() {
      const session = getSession();
      if (!session) {
        reviewsList.innerHTML = '<div class="empty">Please login to view feedback.</div>';
        return;
      }

      try {
        const reviews = await apiFetch('/api/reviews');
        renderReviews(reviews);
      } catch (err) {
        reviewsList.innerHTML = '<div class="empty">Unable to load feedback right now.</div>';
      }
    }

    function setupLiveReviews() {
      const socket = connectSocket();
      if (!socket) return;

      socket.on('review:new', () => {
        loadReviews();
      });
    }

    feedbackForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const title = document.getElementById('title').value.trim();
      const rating = Number(document.getElementById('rating').value);
      const comment = document.getElementById('comment').value.trim();

      if (!title || !comment || !rating) {
        alert('Please fill in title, rating, and feedback.');
        return;
      }

      try {
        const session = getSession();
        if (!session) {
          alert('Please login first to submit feedback.');
          window.location.href = 'login.html';
          return;
        }

        await apiFetch('/api/reviews', 'POST', { title, rating, comment });
        feedbackForm.reset();
        await loadReviews();
        alert('Thank you for your feedback!');
      } catch (err) {
        if (String(err.message).includes('Please login first') || String(err.message).includes('Not authorized')) {
          localStorage.removeItem('fh_token');
          alert('Your session has expired. Please login again.');
          window.location.href = 'login.html';
          return;
        }
        alert(err.message || 'Unable to submit feedback.');
      }
    });

    feedbackForm.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || event.target.tagName === 'TEXTAREA') return;

      event.preventDefault();
      feedbackForm.requestSubmit();
    });

    if (!getSession()) {
      alert('Please login first to submit feedback.');
      window.location.href = 'login.html';
    } else {
      loadReviews();
      setupLiveReviews();
    }
  </script>
</body>
</html>
