<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Feedback</title>
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #f7f9fc; color: #333; }

        .sidebar { width: 220px; background-color: #ff6a19; color: white; padding: 20px 0; flex-shrink: 0; }
        .sidebar h2 { padding: 0 20px; font-size: 1.25rem; margin-bottom: 25px; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 0; margin: 4px 12px; border-radius: 6px; }
        .sidebar ul li a { display: block; padding: 12px 20px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.9rem; border-left: 3px solid transparent; }
        .sidebar ul li:hover { background-color: rgba(255,255,255,0.1); }
        .sidebar ul li.active { background-color: rgba(255,255,255,0.1); }
        .sidebar ul li.active a { color: white; border-left-color: white; font-weight: 500; }

        .main-content { flex-grow: 1; padding: 25px; overflow-y: auto; }
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .main-header h1 { font-size: 1.5rem; color: #444; }
        .live-status { color: #28a745; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .live-status::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: #28a745; border-radius: 50%; }

        .table-wrapper { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead { background-color: #ff6a19; color: white; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; vertical-align: top; }
        th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tbody tr:nth-child(even) { background-color: #fcfdfd; }
        .empty { text-align: center; color: #888; padding: 30px; }
        .rating { color: #ffb000; font-weight: 700; }
        .comment { max-width: 360px; line-height: 1.5; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admindashbord.html">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="admindashbordcatering.html">Catering</a></li>
            <li class="active"><a href="adminfeedback.html">Feedback</a></li>
            <li><a href="login.html" onclick="logoutUser(); return false;">Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1>Customer Feedback</h1>
            <div class="live-status">Live — synced across all pages</div>
        </header>

        <section class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Title</th>
                        <th>Rating</th>
                        <th>Comment</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="feedbackTableBody">
                    <tr><td colspan="5" class="empty">Loading feedback...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="assets/app.js"></script>
    <script>
        const session = requireAdmin();
        const feedbackTableBody = document.getElementById('feedbackTableBody');

        function renderStars(rating) {
            const safeRating = Number(rating || 0);
            return '★'.repeat(safeRating) + '☆'.repeat(5 - safeRating);
        }

        function renderFeedbackTable(reviews) {
            if (!reviews || !reviews.length) {
                feedbackTableBody.innerHTML = '<tr><td colspan="5" class="empty">No feedback received yet.</td></tr>';
                return;
            }

            feedbackTableBody.innerHTML = reviews.map(item => {
                const userName = item.user?.name || 'Customer';
                const title = item.title || 'Feedback';
                const rating = Number(item.rating || 0);
                const comment = item.comment || 'No comment';
                const createdAt = item.createdAt ? new Date(item.createdAt).toLocaleString() : 'N/A';

                return `
                    <tr>
                        <td>${userName}</td>
                        <td>${title}</td>
                        <td class="rating">${renderStars(rating)}</td>
                        <td class="comment">${comment}</td>
                        <td>${createdAt}</td>
                    </tr>
                `;
            }).join('');
        }

        async function loadFeedback() {
            try {
                const reviews = await getReviews();
                renderFeedbackTable(reviews);
            } catch (err) {
                feedbackTableBody.innerHTML = '<tr><td colspan="5" class="empty">Unable to load feedback.</td></tr>';
                console.error(err);
            }
        }

        function setupLiveFeedback() {
            const socket = connectSocket();
            if (!socket) return;

            socket.on('review:new', () => {
                loadFeedback();
            });
        }

        loadFeedback();
        setupLiveFeedback();
    </script>
</body>
</html>
