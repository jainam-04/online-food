<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout - FoodieHub</title>
<link rel="stylesheet" href="assets/responsive.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.box{
    text-align:center;
    width:380px;
    padding:45px 40px;
    border-radius:20px;
    background:rgba(20,20,20,0.55);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.1);
    color:white;
    box-shadow:0 15px 35px rgba(0,0,0,0.5);
    animation:fadeIn 0.8s ease;
}

.icon-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
}

.door-icon{
    width:14px;
    height:34px;
    border-radius:3px;
    background:linear-gradient(180deg,#ff8a3d,#ff5f2e);
    box-shadow:0 3px 8px rgba(255,95,46,0.4);
}

.box h2{
    font-size:30px;
    font-weight:bold;
}

.box p{
    font-size:16px;
    margin-bottom:28px;
    color:rgba(255,255,255,0.85);
}

button{
    padding:12px 34px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#ff512f,#f09819);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.06);
    box-shadow:0 5px 20px rgba(255,152,0,0.5);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="box">
    <div class="icon-title">
        <span class="door-icon"></span>
        <h2>Logout</h2>
    </div>
    <p>Click below to go to login page</p>

    <button onclick="logout()">Logout</button>
</div>

<script src="assets/app.js"></script>
<script>
function logout() {
    if (typeof logoutUser === 'function') {
        logoutUser();
        return;
    }

    localStorage.removeItem('fh_token');
    window.location.href = 'login.html';
}

document.addEventListener('DOMContentLoaded', () => {
    logout();
});
</script>

</body>
</html>
