<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieHub Admin Login</title>
<link rel="stylesheet" href="assets/responsive.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff5722,#ff9800);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#ff5722;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#ff5722;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#e64a19;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#ff5722;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="login-box">

    <h2>🍔 FoodieHub Login</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p>
        New User?
        <a href="register.html">Register</a>
    </p>

</div>

<script src="assets/app.js"></script>
<script>
    const session = getSession();
    if (session && session.isAdmin) {
        window.location.href = "admindashbord.html";
    }

    async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            alert("Please enter email and password");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                alert(data.message || "Login failed");
                return;
            }

            const isAdmin = Boolean(data.user && (data.user.isAdmin || data.user.role === "admin"));
            if (!isAdmin) {
                alert("Access Denied: You are not an admin");
                return;
            }

            // Save token + user for later authenticated requests
            localStorage.setItem("fh_token", data.token);
            alert("Admin Login Successful ✅");
            window.location.href = "admindashbord.html";

        } catch (err) {
            alert(`Could not reach server at ${API_BASE}. Is the backend running?`);
        }
    }
</script>

</body>
</html>
